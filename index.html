<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execution Quality Score</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;width:100%}
.page{display:none;flex-direction:column;align-items:center;padding:30px 20px;min-height:100vh}
.page.active{display:flex}
.main-title{font-size:2.2rem;font-weight:700;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;color:#ffffff;text-align:center}
.main-subtitle{font-size:1rem;color:#ccc;margin-bottom:30px;text-align:center}
.main-pie-wrap{position:relative;width:600px;height:600px;margin-bottom:20px}
.main-pie-svg{width:100%;height:100%}
.main-quad{cursor:pointer;transition:filter .3s ease,opacity .3s ease;opacity:.85}
.main-quad:hover{filter:brightness(1.3) drop-shadow(0 0 14px rgba(255,255,255,.3));opacity:1}
.quad-label{pointer-events:none;font-size:36px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.quad-sublabel{pointer-events:none;font-size:16px;fill:rgba(255,255,255,.7);text-anchor:middle;dominant-baseline:central}
.center-circle{fill:#1a1a2e}
.center-text{font-size:16px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;letter-spacing:1px;text-transform:uppercase}
.click-hint{font-size:.95rem;color:#666;margin-top:14px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.back-btn{align-self:flex-start;background:none;border:2px solid rgba(255,255,255,.3);color:#fff;padding:10px 24px;border-radius:25px;cursor:pointer;font-size:1rem;transition:all .3s ease;margin-bottom:20px}
.back-btn:hover{border-color:#00a344;background:rgba(0,163,68,.15)}
.detail-title{font-size:2.4rem;font-weight:700;margin-bottom:6px;text-align:center}
.detail-subtitle{font-size:1rem;color:#aaa;margin-bottom:30px;text-align:center;max-width:800px;line-height:1.5}
.charts-row{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:nowrap;width:100%;max-width:1400px;margin-bottom:24px}
.chart-col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:280px;max-width:420px}
.chart-col h3{font-size:1.6rem;margin-bottom:16px;color:#ccc;text-align:center}
.detail-pie-wrap{position:relative;width:380px;height:380px}
.detail-pie-svg{width:100%;height:100%}
.slice{cursor:pointer;transition:filter .3s ease,opacity .3s ease;opacity:.8}
.slice:hover{filter:brightness(1.25) drop-shadow(0 0 10px rgba(255,255,255,.25));opacity:1}
.slice.active-slice{filter:brightness(1.35);opacity:1;stroke:#fff;stroke-width:2}
.slice-label{pointer-events:none;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.slice-pct{pointer-events:none;fill:rgba(255,255,255,.85);text-anchor:middle;dominant-baseline:central;font-weight:600}
.rme-circle{cursor:pointer;transition:filter .3s ease,opacity .3s ease;opacity:.85}
.rme-circle:hover{filter:brightness(1.25) drop-shadow(0 0 14px rgba(255,255,255,.3));opacity:1}
.rme-circle.active-slice{filter:brightness(1.35);opacity:1;stroke:#fff;stroke-width:3}
.rme-label{pointer-events:none;font-size:32px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.rme-pct{pointer-events:none;font-size:24px;fill:rgba(255,255,255,.85);text-anchor:middle;dominant-baseline:central;font-weight:600}
.bubble-wrap{width:100%;max-width:1000px;min-height:60px;margin-bottom:20px;display:flex;justify-content:center}
.bubble{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:24px 30px;max-width:700px;width:100%;opacity:0;transform:translateY(10px);transition:all .35s ease;display:none}
.bubble.show{display:block;opacity:1;transform:translateY(0)}
.bubble h4{font-size:1.2rem;margin-bottom:10px}
.bubble p{font-size:1rem;line-height:1.7;color:#ccc}
.bubble .weight-badge{display:inline-block;padding:4px 14px;border-radius:12px;font-size:.85rem;font-weight:600;margin-bottom:10px;color:#fff}
@media(max-width:680px){.main-pie-wrap{width:95vw;height:95vw}.detail-pie-wrap{width:90vw;height:90vw}.charts-row{gap:20px}.quad-label{font-size:24px}}
</style>
</head>
<body>
<div class="page active" id="page-main">
<div class="main-title">Execution Quality Score</div>
<div class="main-subtitle">Click a section to explore its KPIs</div>
<div class="main-pie-wrap">
<svg class="main-pie-svg" viewBox="0 0 600 600">
<path class="main-quad" d="M300,300 L300,18 A282,282 0 0,1 582,300 Z" fill="#2772b6" onclick="goDetail('opseng')"/>
<path class="main-quad" d="M300,300 L582,300 A282,282 0 0,1 300,582 Z" fill="#00a344" onclick="goDetail('startup')"/>
<path class="main-quad" d="M300,300 L300,582 A282,282 0 0,1 18,300 Z" fill="#e88a2d" onclick="goDetail('rme')"/>
<path class="main-quad" d="M300,300 L18,300 A282,282 0 0,1 300,18 Z" fill="#7b4fb5" onclick="goDetail('dc')"/>
<circle cx="300" cy="300" r="65" class="center-circle"/>
<text x="300" y="292" class="center-text">Execution</text><text x="300" y="314" class="center-text">Quality</text>
<text x="441" y="175" class="quad-label">Ops Eng</text><text x="441" y="213" class="quad-sublabel">Score % at First Ship</text>
<text x="441" y="400" class="quad-label">Startup</text><text x="441" y="438" class="quad-sublabel">Score % at First Ship</text>
<text x="159" y="400" class="quad-label">RME</text><text x="159" y="438" class="quad-sublabel">Score % at First Ship</text>
<text x="159" y="175" class="quad-label">D&amp;C</text><text x="159" y="213" class="quad-sublabel">Score % at First Ship</text>
</svg>
</div>
<div class="click-hint">Click any section to explore</div>
</div>
<div class="page" id="page-opseng"></div>
<div class="page" id="page-startup"></div>
<div class="page" id="page-dc"></div>
<div class="page" id="page-rme"></div>
<script>
var SECTIONS={
opseng:{title:"Operations Engineering",color:"#2772b6",subtitle:"All KPIs apply to both NA and International regions.",hasRegions:false,isRME:false,
kpis:[
{name:"MHE Punchlist %",weight:20,def:"Examining the % of punchlist items completed at the time of building launch represent unfinished work or minor defects. A high score signifies successful preparation for launch success."},
{name:"MHE Testing Completion %",weight:20,def:"Measures the proportion of completed MHE testing activities against planned testing requirements."},
{name:"MHE Testing FPY Rate %",weight:20,def:"Tracks the \u201CFirst time right\u201D rate of the project by providing insights on the vendor efficiency to meet the testing criteria. A high First Pass Yield Rate indicates efficient processes and reliable equipment production, while a low rate suggests potential quality issues that need addressing in the manufacturing or installation process."},
{name:"QI Completion %",weight:20,def:"Tracks the completion of all the Ops Engineering & RME Quality Inspection processes. It takes into account VQ (CF Only) and IOQ."},
{name:"QI FPY Rate %",weight:20,def:"Tracks the \u201CFirst time right\u201D rate of the project by providing insights on the vendor efficiency to meet our Amazon Requirements. It takes into account WHS inspection, VQ (CF Only) and IOQ."}
]},
startup:{title:"Startup Quality",color:"#00a344",subtitle:"Refer to the IPQS policy for mile-specific score weightings.",hasRegions:true,isRME:false,
na:[
{name:"SU ORT - Final Pass",weight:50,def:"Measures overall site module readiness as compared to deployment, power, configuration and functionality. From ORT Tool: Phase = \u201CFinal\u201D, Business Owner = \u201CStart Up\u201D, Under \u201COverall Module Readiness.\u201D The metric used is \u201C% Pass\u201D \u2014 a measurement of Total Stations Passed out of Total Number of Stations per site. Metric Date will equal Launch/Go-Live Date Milestone. Criticality will not be used."},
{name:"SU ORT - Initial Pass",weight:10,def:"Verifies that systems, processes, and equipment are fully functional and meeting performance standards before being deployed into production operations. This metric ensures operational reliability, reduces the risk of post-deployment issues, and confirms that new implementations or changes are ready for live operations."},
{name:"Closure Punchlist %",weight:40,def:"Measures the quality of customer product safety and items outside of module, Ops Eng, or constructions. Punchlist items that are not assigned to D&C or Ops Eng, or marked as extended scope."}
],
eu:[
{name:"SU ORT - Final Pass (Station Readiness)",weight:25,def:"Measures overall site module readiness as compared to deployment, power, configuration and functionality. From ORT Tool: Phase = \u201CFinal\u201D, Business Owner = \u201CStart Up\u201D, Under \u201COverall Module Readiness.\u201D The metric used is \u201C% Pass\u201D \u2014 a measurement of Total Stations Passed out of Total Number of Stations per site."},
{name:"SU ORT - Initial Pass (Station Readiness)",weight:50,def:"Verifies that systems, processes, and equipment are fully functional and meeting performance standards before being deployed into production operations. This metric ensures operational reliability, reduces the risk of post-deployment issues, and confirms that new implementations or changes are ready for live operations."},
{name:"Closure Punchlist %",weight:25,def:"Measures the quality of customer product safety and items outside of module, Ops Eng, or constructions. Punchlist items that are not assigned to D&C or Ops Eng, or marked as extended scope."}
],
latam:[
{name:"SU ORT - Final Pass",weight:40,def:"Measures overall site module readiness as compared to deployment, power, configuration and functionality. From ORT Tool: Phase = \u201CFinal\u201D, Business Owner = \u201CStart Up\u201D, Under \u201COverall Module Readiness.\u201D The metric used is \u201C% Pass\u201D \u2014 a measurement of Total Stations Passed out of Total Number of Stations per site."},
{name:"SU ORT - Initial Pass",weight:30,def:"Verifies that systems, processes, and equipment are fully functional and meeting performance standards before being deployed into production operations. This metric ensures operational reliability, reduces the risk of post-deployment issues, and confirms that new implementations or changes are ready for live operations."},
{name:"Closure Punchlist %",weight:30,def:"Measures the quality of customer product safety and items outside of module, Ops Eng, or constructions. Punchlist items that are not assigned to D&C or Ops Eng, or marked as extended scope."}
]},
dc:{title:"Design & Construction",color:"#7b4fb5",subtitle:"Refer to the IPQS policy for mile-specific score weightings.",hasRegions:true,isRME:false,
na:[
{name:"Closure Punchlist %",weight:50,def:"Assesses the status of D&C Quality by examining the % of punchlist items completed at the time of building launch that were assigned to the D&C Team. Punchlist items are tasks identified during inspections that represent unfinished work or minor defects. The metric includes WHS DC Launch findings categories A & B (within the contractual requirements)."},
{name:"BMS Readiness %",weight:50,def:"Assesses the status of D&C Quality by verifying that BMS has been installed and is active via the BMS Dashboard."}
],
eu:[
{name:"Closure Punchlist %",weight:25,def:"Assesses the status of D&C Quality by examining the % of punchlist items completed at the time of building launch that were assigned to the D&C Team. Punchlist items are tasks identified during inspections that represent unfinished work or minor defects. The metric includes WHS DC Launch findings categories A & B (within the contractual requirements)."},
{name:"Commissioning Completion %",weight:25,def:"Measures whether all systems and assets defined in the AZR0003 asset list have been fully commissioned by First Ship, ensuring complete system readiness at the point of operational handover. <span style='color:#ff4444;'>Only applicable to International First Mile.</span>"},
{name:"BMS Readiness %",weight:25,def:"Assesses the status of D&C Quality by verifying that BMS has been installed and is active via the BMS Dashboard."},
{name:"Documentation Compliance %",weight:25,def:"Measures the completeness of all project documentation, including permits, technical drawings, as-built records, O&M manuals, and all other required project documents (as per AZR0003 Appendix 8), submitted, approved, and uploaded to BIM360 by First Ship. Ensures a fully auditable and accessible project record at handover. <span style='color:#ff4444;'>Only applicable to International All Miles.</span>"}
]},
rme:{title:"RME Quality",color:"#e88a2d",subtitle:"Applies to both NA and International regions.",hasRegions:false,isRME:true,
kpis:[
{name:"CMQA Score",weight:100,def:"The CMQA Score factors in metrics for MHE/BB/GA/NTI IOQ, Training, Headcount, Services, Modules, Performance, and Site Readiness topics, and compares them against the defined targets defined at each project milestone."}
]}
};
var PALETTE=["#2772b6","#00a344","#e88a2d","#7b4fb5","#1a8ccc","#d4563a","#3bb8a0","#c75dbd"];
function goDetail(key){document.getElementById("page-main").classList.remove("active");buildDetail(key);document.getElementById("page-"+key).classList.add("active")}
function goMain(){document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});document.getElementById("page-main").classList.add("active")}
function buildDetail(key){
var s=SECTIONS[key];var pg=document.getElementById("page-"+key);
var h='<button class="back-btn" onclick="goMain()">\u2190 Back to Overview</button>';
h+='<div class="detail-title" style="color:'+s.color+'">'+s.title+'</div>';
h+='<div class="detail-subtitle">'+s.subtitle+'</div>';
h+='<div class="charts-row">';
if(s.isRME){
h+='<div class="chart-col"><h3>NA &amp; International Regions</h3><div class="detail-pie-wrap">'+buildRME(key)+'</div></div>';
}else if(s.hasRegions){
h+='<div class="chart-col"><h3>NA Region</h3><div class="detail-pie-wrap">'+buildPieSVG(s.na,key+"_na",null)+'</div></div>';
h+='<div class="chart-col"><h3>EU + AUS</h3><div class="detail-pie-wrap">'+buildPieSVG(s.eu,key+"_eu",null)+'</div></div>';
if(s.latam){h+='<div class="chart-col"><h3>LATAM + AMET</h3><div class="detail-pie-wrap">'+buildPieSVG(s.latam,key+"_latam",null)+'</div></div>';}
}else{
h+='<div class="chart-col"><h3>NA &amp; International Regions</h3><div class="detail-pie-wrap">'+buildPieSVG(s.kpis,key+"_all",s.startAngle)+'</div></div>';
}
h+='</div>';
h+='<div class="bubble-wrap"><div class="bubble" id="bubble-'+key+'"><div class="weight-badge" id="badge-'+key+'"></div><h4 id="btitle-'+key+'"></h4><p id="btext-'+key+'"></p></div></div>';
pg.innerHTML=h;
}
function buildRME(key){
var svg='<svg class="detail-pie-svg" viewBox="0 0 600 600">';
svg+='<circle class="rme-circle" cx="300" cy="300" r="270" fill="#e88a2d" onclick="showBubble(\''+key+'_all\',0)"/>';
svg+='<text x="300" y="280" class="rme-label">CMQA Score</text>';
svg+='<text x="300" y="320" class="rme-pct">100%</text>';
svg+='</svg>';
return svg;
}
function buildPieSVG(kpis,prefix,customStart){
var cx=300,cy=300,r=270;
var svg='<svg class="detail-pie-svg" viewBox="0 0 600 600">';
var startAngle=(typeof customStart==="number")?customStart:-90;
var numKpis=kpis.length;
var baseFontLabel=numKpis<=2?24:numKpis<=4?20:19;
var baseFontPct=numKpis<=2?22:numKpis<=4?17:16;
for(var i=0;i<kpis.length;i++){
var k=kpis[i];var sweep=k.weight/100*360;
var endAngle=startAngle+sweep;
var large=sweep>180?1:0;
var s1=rad(startAngle),e1=rad(endAngle);
var ox1=cx+r*Math.cos(s1),oy1=cy+r*Math.sin(s1);
var ox2=cx+r*Math.cos(e1),oy2=cy+r*Math.sin(e1);
var d="M"+cx+","+cy+" L"+ox1+","+oy1+" A"+r+","+r+" 0 "+large+",1 "+ox2+","+oy2+" Z";
var col=PALETTE[i%PALETTE.length];
var mid=rad(startAngle+sweep/2);
var isSmall=k.weight<15;
var lr=isSmall?r*0.75:r*0.55;
var lx=cx+lr*Math.cos(mid),ly=cy+lr*Math.sin(mid);
var sliceFontLabel=isSmall?11:baseFontLabel;
var sliceFontPct=isSmall?10:baseFontPct;
var wrapLimit=isSmall?12:(numKpis<=2?22:18);
svg+='<path class="slice" d="'+d+'" fill="'+col+'" data-prefix="'+prefix+'" data-idx="'+i+'" onclick="showBubble(\''+prefix+'\','+i+')"/>';
var lines=wrapText(k.name,wrapLimit);
var totalH=lines.length*sliceFontLabel*1.2+sliceFontPct*1.2;
var startY=ly-totalH/2+sliceFontLabel*0.6;
for(var li=0;li<lines.length;li++){
svg+='<text x="'+lx+'" y="'+(startY+li*sliceFontLabel*1.2)+'" class="slice-label" style="font-size:'+sliceFontLabel+'px">'+lines[li]+'</text>';
}
svg+='<text x="'+lx+'" y="'+(startY+lines.length*sliceFontLabel*1.2+4)+'" class="slice-pct" style="font-size:'+sliceFontPct+'px">'+k.weight+'%</text>';
startAngle=endAngle;
}
svg+='</svg>';
return svg;
}
function wrapText(text,maxChars){
var words=text.split(" ");var lines=[];var cur="";
for(var i=0;i<words.length;i++){
var test=cur?cur+" "+words[i]:words[i];
if(test.length>maxChars&&cur){lines.push(cur);cur=words[i]}
else{cur=test}
}
if(cur)lines.push(cur);
return lines;
}
function rad(deg){return deg*Math.PI/180}
function showBubble(prefix,idx){
var parts=prefix.split("_");var key=parts[0];var region=parts[1];
var s=SECTIONS[key];var kpis;
if(s.hasRegions){if(region==="na")kpis=s.na;else if(region==="latam")kpis=s.latam;else kpis=s.eu}else{kpis=s.kpis}
var k=kpis[idx];
document.querySelectorAll(".slice.active-slice,.rme-circle.active-slice").forEach(function(el){el.classList.remove("active-slice")});
var clicked=document.querySelectorAll('[data-prefix="'+prefix+'"][data-idx="'+idx+'"]');
clicked.forEach(function(el){el.classList.add("active-slice")});
if(s.isRME){document.querySelectorAll(".rme-circle").forEach(function(c){c.classList.add("active-slice")})}
var bubble=document.getElementById("bubble-"+key);
var badge=document.getElementById("badge-"+key);
var btitle=document.getElementById("btitle-"+key);
var btext=document.getElementById("btext-"+key);
badge.textContent="Weight: "+k.weight+"%";
badge.style.background=s.isRME?s.color:PALETTE[idx%PALETTE.length];
btitle.textContent=k.name;
btext.innerHTML=k.def;
bubble.classList.remove("show");
setTimeout(function(){bubble.classList.add("show")},50);
}
</script>
</body>
</html>
